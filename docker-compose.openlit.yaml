services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.4.1
    container_name: openlit-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - openlit_clickhouse_data:/var/lib/clickhouse
    environment:
      - CLICKHOUSE_DB=openlit
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=OPENLIT
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q localhost:8123/ping || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  openlit:
    image: ghcr.io/openlit/openlit:latest
    container_name: openlit-server
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"
    environment:
      - TELEMETRY_ENABLED=true
      - CLICKHOUSE_URL=http://clickhouse:8123
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=OPENLIT
      - CLICKHOUSE_DB=openlit
      - NEXTAUTH_SECRET=observe-sre-secret-key-32-chars-long!
      - NEXTAUTH_URL=http://localhost:3000
      - SQLITE_DATABASE_URL=file:/app/client/data/openlit.db
    depends_on:
      clickhouse:
        condition: service_healthy
    volumes:
      - openlit_app_data:/app/client/data
      - ./otel/otel-collector-config.yaml:/etc/otel/otel-collector-config.yaml
    restart: unless-stopped

volumes:
  openlit_clickhouse_data:
  openlit_app_data:
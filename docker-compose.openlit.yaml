services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: openlit-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - openlit_clickhouse_data:/var/lib/clickhouse
    environment:
      - CLICKHOUSE_DB=openlit
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  openlit:
    image: ghcr.io/openlit/openlit:latest
    container_name: openlit-server
    ports:
      - "3000:3000"  # Web UI
      - "4318:4318"  # OTLP HTTP Receiver
    environment:
      - TELEMETRY_ENABLED=true
      - CLICKHOUSE_URL=http://openlit-clickhouse:8123
      - CLICKHOUSE_HOST=openlit-clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
      - CLICKHOUSE_DB=openlit
      - NEXTAUTH_SECRET=observe-sre-secret-key-32-chars-long!
      - NEXTAUTH_URL=http://localhost:3000
      - SQLITE_DATABASE_URL=file:/app/client/data/openlit.db
    depends_on:
      clickhouse:
        condition: service_healthy
    volumes:
      - openlit_app_data:/app/client/data
      - ./otel/otel-collector-config.yaml:/etc/otel/otel-collector-config.yaml

volumes:
  openlit_clickhouse_data:
  openlit_app_data:
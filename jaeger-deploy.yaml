apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger-standalone
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger-standalone
  template:
    metadata:
      labels:
        app: jaeger-standalone
    spec:
      containers:
      - name: jaeger
        image: jaegertracing/all-in-one:latest
        env:
        - name: COLLECTOR_OTLP_ENABLED
          value: "true"
        ports:
        - containerPort: 16686
          name: ui
        - containerPort: 4317
          name: otlp-grpc
        - containerPort: 4318
          name: otlp-http
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-standalone
  namespace: default
spec:
  selector:
    app: jaeger-standalone
  ports:
  - name: ui
    port: 16686
    targetPort: 16686
  - name: otlp-grpc
    port: 4317
    targetPort: 4317
  - name: otlp-http
    port: 4318
    targetPort: 4318